# Elephant by Calypso — hosted MCP server.
# Env with sync: false is set in the Render dashboard, never committed.
services:
  - type: web
    name: elephant-mcp
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELEPHANT_PUBLIC_BASE_URL
        value: https://mcp.calypso.so
      - key: CALYPSO_OAUTH_ISSUER
        value: https://login.calypso.so
      - key: CALYPSO_API_BASE_URL
        value: https://api.calypso.so/v1
      # OpenAI plugin portal domain verification. Public: the server serves it
      # at /.well-known/openai-apps-challenge.
      - key: ELEPHANT_OPENAI_CHALLENGE_TOKEN
        value: "-o3i46cR3iSRrLrF4CbJ1ZVRq0xO8IyLXDa8GvvkaZg"
      - key: ELEPHANT_TOKEN_ENC_KEY
        sync: false
