name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Discovery, challenges and 405s against a local server
        run: npm run smoke

  plugins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build every profile (fails on any rule error)
        run: npm run build -- --profile all
      - name: Archives are reproducible
        run: |
          cp out/SHA256SUMS.txt /tmp/first.txt
          npm run build -- --profile all
          diff /tmp/first.txt out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: elephant-openai-packages
          path: |
            plugins/out/*.zip
            plugins/out/SHA256SUMS.txt
